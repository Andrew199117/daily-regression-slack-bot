name: Daily Regression Slack

on:
  workflow_dispatch:

jobs:
  regression-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run regression bot
        env:
          TEST_EXECUTOR_TOKEN: ${{ secrets.TEST_EXECUTOR_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python daily_regression_bot.py
